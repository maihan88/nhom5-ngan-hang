[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap, monospace"
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "0.6rem"
showWidgetBorder = true

# Mặc định: than chì + vàng đồng – nền giấy ấm, sidebar than
[theme.light]
primaryColor = "#9A6F1E"
backgroundColor = "#F4F3F0"
secondaryBackgroundColor = "#ECE9E3"
textColor = "#17181C"
linkColor = "#8A6416"
borderColor = "#E3E0DA"
dataframeHeaderBackgroundColor = "#EFEDE8"

[theme.light.sidebar]
primaryColor = "#E2B65A"
backgroundColor = "#16181D"
secondaryBackgroundColor = "#25282F"
textColor = "#DAD6CE"
linkColor = "#A8A39A"
borderColor = "#25282F"

# Tối: nền than, điểm nhấn vàng đồng sáng
[theme.dark]
primaryColor = "#E2B65A"
backgroundColor = "#0F1013"
secondaryBackgroundColor = "#1E2127"
textColor = "#ECE8E1"
linkColor = "#E9C46A"
borderColor = "#262931"
dataframeHeaderBackgroundColor = "#1E2127"

[theme.dark.sidebar]
primaryColor = "#E2B65A"
backgroundColor = "#0A0B0D"
secondaryBackgroundColor = "#1A1C21"
textColor = "#CFCAC0"
linkColor = "#9A958B"
borderColor = "#1A1C21"

[client]
toolbarMode = "viewer"

[server]
runOnSave = true

[browser]
gatherUsageStats = false

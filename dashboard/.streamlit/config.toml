[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap, monospace"
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "0.6rem"
showWidgetBorder = true

# Mặc định: sáng navy + trắng (ngân hàng hiện đại)
[theme.light]
primaryColor = "#1C5BD6"
backgroundColor = "#F3F5F9"
secondaryBackgroundColor = "#EAEFF6"
textColor = "#0E1A2B"
linkColor = "#174CB3"
borderColor = "#E1E6EE"
dataframeHeaderBackgroundColor = "#EEF2F7"

[theme.light.sidebar]
primaryColor = "#7FB2FF"
backgroundColor = "#0E2442"
secondaryBackgroundColor = "#1D3D66"
textColor = "#E6ECF5"
linkColor = "#B9C6D8"
borderColor = "#1B3557"

# Tối: kiểu terminal tài chính
[theme.dark]
primaryColor = "#5B9DFF"
backgroundColor = "#0A0D12"
secondaryBackgroundColor = "#161D27"
textColor = "#E2E8F0"
linkColor = "#7FB2FF"
borderColor = "#1F2834"
dataframeHeaderBackgroundColor = "#161D27"

[theme.dark.sidebar]
primaryColor = "#5B9DFF"
backgroundColor = "#07090D"
secondaryBackgroundColor = "#141B25"
textColor = "#C9D4E3"
linkColor = "#8E9BAE"
borderColor = "#1A212B"

[client]
toolbarMode = "viewer"

[server]
runOnSave = true

[browser]
gatherUsageStats = false

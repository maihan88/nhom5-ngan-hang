[theme]
base = "light"
primaryColor = "#1A1A1A"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#EAE5DA"
textColor = "#1A1A1A"
linkColor = "#A8381C"
borderColor = "#D9D2C4"
showWidgetBorder = true
baseRadius = "0.35rem"
font = "Be Vietnam Pro:https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap, Georgia, serif"
dataframeHeaderBackgroundColor = "#EFEBE2"

[client]
toolbarMode = "minimal"

[server]
runOnSave = true

[browser]
gatherUsageStats = false
